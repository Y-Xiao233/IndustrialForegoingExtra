plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories{
    maven {
        //JEI
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }

    maven {
        //Ars Nouveau
        url 'https://maven.blamejared.com'
    }

    maven {
        //JEI
        url 'https://modmaven.dev/'
    }

    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }

    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"

        }
    }

    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }

    maven { url = 'https://maven.minecraftforge.net/' }
}

dependencies {
    //JEI
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

    //Industrial Foregoing
    implementation("maven.modrinth:industrial-foregoing:${industrialforegoing_version}")
    implementation "curse.maven:titanium-287342:8426819"

    //Industrial Foregoing Souls
    implementation "curse.maven:industrial-foregoing-souls-904394:${industrialforegoing_souls_version}"

    // Ars Nouveau
    implementation "com.hollingsworth.ars_nouveau:ars_nouveau-${minecraft_version}:${ars_nouveau_version}"
    //TerraBlender
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${minecraft_version}-${terra_blender_version}"
    //Geckolib
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    //Curios API
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    //Patchouli
    implementation "vazkii.patchouli:Patchouli:${patchouli_version}"

    //Productive Bees
    implementation "curse.maven:productivebees-377897:8987967"

    //KubeJS
    implementation "curse.maven:kubejs-238086:7278501"
    implementation "curse.maven:rhino-416294:7104526"

    //Jade
    implementation "curse.maven:jade-324717:7545219"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

//Productive Bees ships Productive Lib as a jar-in-jar (META-INF/jarjar/productivelib-*.jar) and NeoForge does not put
//nested jars onto the compile classpath, so classes like CentrifugeRecipe cannot be resolved while compiling.
//This extracts the nested jar and puts it on the compile only classpath; at runtime the game loads the nested jar.
//An own configuration is used so reading it here cannot depend on the classpath this task feeds into.
configurations {
    productiveBees {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    productiveBees "curse.maven:productivebees-377897:8022994"
}

var productiveLibDir = layout.buildDirectory.dir("productiveLib")
var extractProductiveLib = tasks.register("extractProductiveLib") {
    var beesJars = configurations.productiveBees.filter { it.name.startsWith("productivebees-") && it.name.endsWith(".jar") }
    inputs.files(beesJars)
    outputs.dir(productiveLibDir)
    doLast {
        var target = productiveLibDir.get().asFile
        target.mkdirs()
        beesJars.files.each { outer ->
            new java.util.zip.ZipFile(outer).withCloseable { zip ->
                zip.entries().findAll { it.name.startsWith("META-INF/jarjar/") && it.name.endsWith(".jar") }.each { entry ->
                    var nested = new File(target, entry.name.substring("META-INF/jarjar/".length()))
                    zip.getInputStream(entry).withCloseable { input ->
                        nested.withOutputStream { output -> input.transferTo(output) }
                    }
                }
            }
        }
    }
}

dependencies {
    compileOnly files(extractProductiveLib).asFileTree.matching { include "*.jar" }
}
